<script>
(function(){
  var wrap=document.getElementById('sw');
  var svg=wrap.querySelector('svg');
  var pct=document.getElementById('zPct');
  var W=parseFloat(svg.getAttribute('width')),H=parseFloat(svg.getAttribute('height'));
  var MAX=10,scale=1,tx=0,ty=0;
  function fit(){return Math.min(wrap.clientWidth/W,wrap.clientHeight/H);}
  function clamp(){
    var f=fit();
    scale=Math.min(MAX,Math.max(f,scale));
    var w=wrap.clientWidth,h=wrap.clientHeight,sW=W*scale,sH=H*scale;
    tx=Math.min(Math.max(w-sW,0),Math.max(Math.min(w-sW,0),tx));
    ty=Math.min(Math.max(h-sH,0),Math.max(Math.min(h-sH,0),ty));
  }
  function apply(){
    svg.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';
    pct.textContent=Math.round(scale*100)+'%';
  }
  function zoomAt(cx,cy,f){
    var ns=Math.min(MAX,Math.max(fit(),scale*f));
    if(ns===scale)return;
    tx=cx-(cx-tx)*(ns/scale);
    ty=cy-(cy-ty)*(ns/scale);
    scale=ns;clamp();apply();
  }
  function goTo(s){zoomAt(wrap.clientWidth/2,wrap.clientHeight/2,s/scale);}
  function fitView(){scale=fit();tx=(wrap.clientWidth-W*scale)/2;ty=(wrap.clientHeight-H*scale)/2;clamp();apply();}
  wrap.addEventListener('wheel',function(e){
    e.preventDefault();
    var r=wrap.getBoundingClientRect();
    var d=e.deltaMode===1?e.deltaY*16:e.deltaMode===2?e.deltaY*wrap.clientHeight:e.deltaY;
    if(e.ctrlKey){zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-d*0.0035));}
    else{tx-=e.deltaX;ty-=e.deltaY;clamp();apply();}
  },{passive:false});
  wrap.addEventListener('dblclick',function(e){
    var r=wrap.getBoundingClientRect();
    zoomAt(e.clientX-r.left,e.clientY-r.top,2);
  });
  var pts=new Map(),drag=null,pinch=null;
  wrap.addEventListener('pointerdown',function(e){
    if(e.target.closest('.tb'))return;
    wrap.setPointerCapture(e.pointerId);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){drag={x:e.clientX,y:e.clientY};wrap.classList.add('grabbing');}
    else if(pts.size===2){
      drag=null;
      var p=Array.from(pts.values());
      var mid={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2};
      pinch={d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),s:scale,
             ax:(mid.x-tx)/scale,ay:(mid.y-ty)/scale};
    }
  });
  function release(e){
    pts.delete(e.pointerId);
    if(pts.size<2)pinch=null;
    if(pts.size===0){drag=null;wrap.classList.remove('grabbing');}
  }
  wrap.addEventListener('pointerup',release);
  wrap.addEventListener('pointercancel',release);
  wrap.addEventListener('pointermove',function(e){
    if(!pts.has(e.pointerId))return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&pts.size>=2){
      var p=Array.from(pts.values());
      var mid={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2};
      scale=Math.min(MAX,Math.max(fit(),pinch.s*(Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)/pinch.d)));
      tx=mid.x-pinch.ax*scale;
      ty=mid.y-pinch.ay*scale;
      clamp();apply();
    }else if(drag){
      tx+=e.clientX-drag.x;ty+=e.clientY-drag.y;
      drag={x:e.clientX,y:e.clientY};
      clamp();apply();
    }
  });
  document.getElementById('zOut').addEventListener('click',function(){zoomAt(wrap.clientWidth/2,wrap.clientHeight/2,1/1.4);});
  document.getElementById('zIn').addEventListener('click',function(){zoomAt(wrap.clientWidth/2,wrap.clientHeight/2,1.4);});
  document.getElementById('zFit').addEventListener('click',fitView);
  document.getElementById('z100').addEventListener('click',function(){goTo(1);});
  var rz;
  window.addEventListener('resize',function(){
    clearTimeout(rz);
    rz=setTimeout(function(){if(scale<fit())fitView();else{clamp();apply();}},150);
  });
  scale=fit();
  tx=(wrap.clientWidth-W*scale)/2;
  ty=(wrap.clientHeight-H*scale)/2;
  clamp();apply();
})();
</script>
