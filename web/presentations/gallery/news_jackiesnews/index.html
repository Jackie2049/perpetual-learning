<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[News] 每日快报</title>
<style>
  :root{--bg:#fafafa;--card:#fff;--text:#1f2328;--muted:#6b7280;--border:#e4e6eb;}
  @media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d23;--text:#e6e8eb;--muted:#9aa0a8;--border:#2a2e36;}}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;}
  .wrap{max-width:1400px;margin:0 auto;padding:28px 24px 60px;}
  header h1{margin:0 0 4px;font-size:24px;}
  header .sub{color:var(--muted);font-size:13px;margin-bottom:16px;}
  .empty{background:var(--card);border:1px dashed var(--border);border-radius:10px;min-height:320px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>[News] 每日快报</h1>
  <div class="sub">project: news_jackiesnews</div>
</header>
<div class="empty">首份快报筹备中，敬请期待</div>
</div>
</body>
</html>
