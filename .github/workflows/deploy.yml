name: Deploy Pages

# 每次 push 到 main 时自动重建静态站点并部署到 gh-pages 分支。
# GitHub Pages 已配置为从 gh-pages 分支根目录部署（legacy），
# 因此推送该分支后 GitHub 会自动上线，无需手动运行 web/publish.py。
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        # build.py 依赖 bleach/markdown/pymdownx（pymdownx.arithmatex 数学扩展）
        run: python -m pip install --quiet bleach markdown pymdown-extensions

      - name: Build static snapshot (web/build.py -> web/dist)
        # node 由 runner 自带；公式排版用 web/vendor/katex（已 vendored），无需 npm install。
        run: python web/build.py

      - name: Deploy web/dist to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          REV="$(git rev-parse HEAD)"
          TMP="$(mktemp -d)"
          git init -q "$TMP"
          git -C "$TMP" remote add origin "$REPO_URL"
          git -C "$TMP" config user.name "github-actions[bot]"
          git -C "$TMP" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null 2>&1; then
            git -C "$TMP" fetch -q --depth=1 origin gh-pages
            git -C "$TMP" checkout -q FETCH_HEAD
            git -C "$TMP" rm -q -r --ignore-unmatch .
          else
            git -C "$TMP" checkout -q --orphan gh-pages
          fi
          cp -R web/dist/. "$TMP"/
          echo '{"source":"'$REV'"}' > "$TMP/.perpetual-learning-pages"
          git -C "$TMP" add -A
          if ! git -C "$TMP" diff --cached --quiet; then
            git -C "$TMP" commit -q -m "Publish exploration snapshot ${REV:0:7}"
            git -C "$TMP" push -q origin HEAD:gh-pages
            echo "Deployed snapshot ${REV:0:7} to gh-pages"
          else
            echo "No content change; gh-pages already up to date."
          fi
